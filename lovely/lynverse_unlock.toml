# Neotiyeth
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "self.shattered = true"
position = "after"
payload = '''
check_for_unlock({ type = 'neotiyeth_card_destroyed', destroyed_card = self })
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "function Card:start_dissolve(dissolve_colours, silent, dissolve_time_fac, no_juice)"
position = "after"
payload = '''
check_for_unlock({ type = 'neotiyeth_card_destroyed', destroyed_card = self })
'''
match_indent = true