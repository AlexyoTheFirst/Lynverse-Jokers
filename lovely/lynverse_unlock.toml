[manifest]
version = "1.0.0"
priority = 0

# Troll Lyn
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "function Card:use_consumeable(area, copier)"
position = "after"
payload = '''
if self.config.center.key == 'c_justice' and G.PROFILES and G.SETTINGS.profile then
	local prof = G.PROFILES[G.SETTINGS.profile]
	prof.trollyn_justice_used = (prof.trollyn_justice_used or 0) + 1
	G:save_settings()
	check_for_unlock({ type = 'trollyn_justice_used', count = prof.trollyn_justice_used })
end
'''
match_indent = true

# Future Lyn
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if center_table.name == 'Petroglyph' then"
position = "after"
payload = '''
check_for_unlock({ type = 'future_lyn_petroglyph_redeemed' })
'''
match_indent = true

# Goth Lyn
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "self.opening = true"
position = "after"
payload = '''
if self.ability.name and self.ability.name:find('Spectral') then
	G.GAME.spectral_packs_opened = (G.GAME.spectral_packs_opened or 0) + 1
	check_for_unlock({ type = 'goth_lyn_spectral_packs_opened', count = G.GAME.spectral_packs_opened })
end
'''
match_indent = true
times = 1

